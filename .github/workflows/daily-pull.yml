name: daily-pull

on:
  schedule:
    # 08:17 UTC daily. Deliberately off the hour: GitHub queues scheduled jobs
    # and runs starting on the hour are the most contended, so they get delayed
    # the most. Cron here is best-effort, not guaranteed to the minute -- which
    # is exactly why build_db.py keys off the snapshot filename rather than
    # assuming an exact run time.
    - cron: "17 8 * * *"
  workflow_dispatch:  # lets a run be triggered by hand to test end to end

# Never let two runs commit to the same branch at once. A scheduled run and a
# manual one overlapping would race on the push; this makes the second wait.
concurrency:
  group: daily-pull
  cancel-in-progress: false

permissions:
  contents: write  # required to push the new snapshot back to the repo

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's snapshot
        run: python scripts/fetch.py

      # The database is gitignored and rebuilt on demand, so this commits
      # nothing. It runs as a smoke test: if today's snapshot is malformed,
      # this fails now, on the day it happened, instead of silently sitting in
      # the repo until the notebook trips over it weeks later.
      - name: Validate snapshot by rebuilding the database
        run: python scripts/build_db.py

      - name: Commit and push snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/snapshots
          # Nothing staged means the snapshot was byte-identical to an existing
          # one (a same-day re-run that found no changes). Not an error -- just
          # nothing to do. `git commit` would exit 1 and fail the run.
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%d)"

          # Retry the rebase+push. Both talk to github.com and both can fail
          # for reasons that have nothing to do with this repo: on 2026-09-24
          # the fetch and the commit succeeded and the push came back
          # "remote: Internal Server Error" (HTTP 500). The runner is
          # ephemeral, so that commit died with it and the day's snapshot was
          # lost outright -- an unrecoverable gap in the history from one bad
          # minute on GitHub's side. A single attempt is not good enough for a
          # job whose whole value is not missing days.
          #
          # The rebase is inside the loop on purpose: a failed push may mean
          # another run landed a commit first, so the next attempt has to
          # re-sync before trying again.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              delay=$(( attempt * 15 ))
              echo "Attempt ${attempt} failed; retrying in ${delay}s."
              sleep "${delay}"
            fi
          done
          echo "::error::Push failed after 5 attempts. Today's snapshot was not committed."
          exit 1
